<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Azure VNet peering and custom RBAC architecture</title>
  <desc id="desc">Two Azure virtual networks with a VM in each network, bidirectional VNet peering, a storage account, and a least privilege Computer Operator user assignment.</desc>
  <rect width="1120" height="620" fill="#f6f8fb"/>
  <text x="56" y="64" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Rand Enterprises Azure Evaluation Lab</text>
  <text x="56" y="98" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="18">Two workload networks connected with VNet peering and scoped custom RBAC access</text>

  <rect x="56" y="140" width="440" height="300" rx="8" fill="#ffffff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="88" y="182" fill="#0f4c81" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">rand-workload-vnet-a</text>
  <text x="88" y="214" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="16">10.10.0.0/16</text>
  <rect x="92" y="250" width="332" height="126" rx="8" fill="#eaf4ff" stroke="#82b4e8"/>
  <text x="124" y="288" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">rand-vm-a</text>
  <text x="124" y="318" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15">Ubuntu + Nginx test workload</text>
  <text x="124" y="346" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15">Subnet: 10.10.1.0/24</text>

  <rect x="624" y="140" width="440" height="300" rx="8" fill="#ffffff" stroke="#b8c4d6" stroke-width="2"/>
  <text x="656" y="182" fill="#0f4c81" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">rand-workload-vnet-b</text>
  <text x="656" y="214" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="16">10.20.0.0/16</text>
  <rect x="660" y="250" width="332" height="126" rx="8" fill="#eaf4ff" stroke="#82b4e8"/>
  <text x="692" y="288" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">rand-vm-b</text>
  <text x="692" y="318" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15">Ubuntu + Nginx test workload</text>
  <text x="692" y="346" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="15">Subnet: 10.20.1.0/24</text>

  <path d="M496 288 C540 260 580 260 624 288" fill="none" stroke="#0f766e" stroke-width="5"/>
  <path d="M624 328 C580 356 540 356 496 328" fill="none" stroke="#0f766e" stroke-width="5"/>
  <text x="508" y="248" fill="#0f766e" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Bidirectional VNet peering</text>

  <rect x="88" y="488" width="308" height="78" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="116" y="522" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Storage Account</text>
  <text x="116" y="548" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="14">Read validation target for custom role</text>

  <rect x="724" y="488" width="308" height="78" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="752" y="522" fill="#172033" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Computer Operator User</text>
  <text x="752" y="548" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="14">Read resources, start and restart VMs</text>

  <path d="M724 526 L396 526" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="478" y="510" fill="#536173" font-family="Segoe UI, Arial, sans-serif" font-size="14">Resource-group-scoped RBAC assignment</text>
</svg>
